[mod-name]
antitrypophobia2=Anti Trypophobia for 2.0

[mod-description]
antitrypophobia2=Replaces spawner, corpse, biolab, and captive spawner graphics with trypophobia-friendly versions by default, with a per-player option to restore vanilla visuals.

[mod-setting-name]
antitrypophobia-enabled=Enable anti-trypophobia visuals

[mod-setting-description]
antitrypophobia-enabled=When enabled (default), displays neutral replacement sprites for biter spawners, spitter spawners, corpses, biolabs, and captive spawners. Uncheck this if you personally prefer to see the original base game sprites in multiplayer.
